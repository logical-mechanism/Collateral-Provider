# Replace www.giveme.my and the certificate paths before enabling this file.
# The application enforces its own 36 KiB request limit and JSON 413 envelope;
# nginx's larger ceiling is a second bound for obviously abusive requests.

server {
    listen 80;
    listen [::]:80;
    server_name www.giveme.my;

    location / {
        return 301 https://www.giveme.my$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.giveme.my;

    ssl_certificate /etc/letsencrypt/live/www.giveme.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.giveme.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CollateralProviderTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 75s;

    # Request bodies and client IPs are deliberately not retained here. Error
    # logs may still contain operational metadata; set their retention locally.
    access_log off;
    error_log /var/log/nginx/collateral-provider.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the wallet's correlation ID; Django accepts only a bounded
        # safe ASCII form and replaces anything missing or unsafe.
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
